global_costmap:
  global_frame: map              # utm → map (EKF 융합 좌표계)
  robot_base_frame: base_link
  update_frequency: 10
  publish_frequency: 10
  static_map: false
  rolling_window: true
  width: 40.0
  height: 40.0
  resolution: 0.05
  transform_tolerance: 0.5       # TF 대기 시간 (EKF 융합 고려)
  reset_distance: 2.5
  track_unknown_space: false

  plugins:
    - {name: obstacles_laser, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}